# Loads the built VST3 in pluginval (the same kind of stress test a DAW's scanner and host do): state save and load,
# automation, resizing, threading. Runs on every push to main and by hand. The result is also printed as annotations.
name: pluginval
on:
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'CMakeLists.txt', '.github/workflows/pluginval.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the VST3
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb unzip
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: Run pluginval
        shell: bash
        run: |
          curl -fsSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pv.zip; chmod +x pluginval
          v=$(find build -type d -name "*.vst3" | head -1); echo "Testing $v"
          set +e
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --skip-gui-tests false --timeout-ms 120000 --verbose "$v" 2>&1 | tee pv.log
          code=${PIPESTATUS[0]}
          echo "pluginval exit code: $code"
          (grep -iE "fail|error|assert|crash" pv.log | head -n 8; tail -n 6 pv.log) | while IFS= read -r l; do echo "::notice::${l:0:300}"; done
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pluginval-log, path: pv.log }
